name: grpctest-es-lab

services:
  es:
    build: .
    image: grpctest-es-lab:8.19.22-smartcn
    environment:
      cluster.name: grpctest-es-lab
      node.name: es-lab-01
      discovery.type: single-node
      # Synthetic data, dedicated network, loopback port: local learning only.
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9201:9200"
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    volumes:
      - type: bind
        source: ../../.local/es-lab/elasticsearch/config
        target: /usr/share/elasticsearch/config
        bind:
          create_host_path: false
      - type: bind
        source: ../../.local/es-lab/elasticsearch/data
        target: /usr/share/elasticsearch/data
        bind:
          create_host_path: false
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=green&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 40
    stop_grace_period: 30s

  kibana:
    profiles: [ui]
    image: docker.elastic.co/kibana/kibana:8.19.22@sha256:fb480ca9e34feb91738348ead6be37400c1017592bee7e7a5119a5fcd3d5fc69
    environment:
      SERVER_NAME: grpctest-es-lab-kibana
      ELASTICSEARCH_HOSTS: '["http://es:9200"]'
      NODE_OPTIONS: --max-old-space-size=1024
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    mem_limit: 2g
    cpus: 2
    networks: [lab]
    depends_on:
      es:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
    stop_grace_period: 30s

  mysql:
    profiles: [compare]
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: es_lab
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
    # No host port; root is used only by docker compose exec inside this container.
    tmpfs:
      - /var/lib/mysql:size=512m
    mem_limit: 768m
    cpus: 1
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' es_lab >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

networks:
  lab: {}
