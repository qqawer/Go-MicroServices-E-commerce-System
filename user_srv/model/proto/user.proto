syntax="proto3";
import "google/protobuf/empty.proto";
option go_package =".;proto";
//protoc --go_out=. --go-grpc_out=. helloworld.proto
service User{
    rpc GetUserList(PageInfo) returns (UserListResponse);//用户列表
    rpc GetUserByMobile(MobileRequest) returns (UserInfoResponse);//通过Mobile查询用户
    rpc GetUserById(IdRequest)returns (UserInfoResponse); //通过id查询用户
    rpc CreateUser(CreateUserInfo) returns (UserInfoResponse);//添加用户
    rpc Updateuser(UpdateUserInfo) returns (google.protobuf.Empty);//更新用户
    rpc PatchUser(PatchUserInfo) returns (google.protobuf.Empty);//仅修改明确提交的个人资料字段
    rpc CheckPassWord(PasswordCheckInfo) returns (CheckResponse);//检查密码
}
message PasswordCheckInfo{
    string password=1;
    string encryptedPassword=2;
}
message CheckResponse{
    bool success=1;
}
message PageInfo {
    uint32 pn=1;
    uint32 pSize=2;
}
message MobileRequest{
    string mobile=1;
}
message IdRequest {
    int32 id=1;
}
message CreateUserInfo{
    string nickName=1;
    string passWord=2;
    string mobile=3;
}

message UpdateUserInfo{
    int32 id=1;
    optional string nickName=2;
    optional string gender=3;
    optional uint64 birthDay=4;
}
message PatchUserInfo{
    int32 id=1;
    optional string nickName=2;
    optional string gender=3;
    optional string birthdayDate=4; // YYYY-MM-DD；缺省不修改，空字符串清空。
}
message UserInfoResponse{
    int32 id=1;
    string password=2;
    string mobile=3;
    string nickName=4;
    optional uint64 birthday=5; // 未填写生日时省略，显式 0 仍表示有效时间戳。
    string gender=6;
    int32 role=7;
    optional string birthdayDate=8; // 按数据库中的日历日期返回，不做跨时区转换。
}
message UserListResponse{
    int32 total=1;
    repeated UserInfoResponse data=2;
}
