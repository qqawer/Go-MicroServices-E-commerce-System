syntax = "proto3";
import "google/protobuf/empty.proto";
option go_package = "/.;proto";

service Inventory {
    rpc InitInv(GoodsInventoryInfo) returns (GoodsInventoryInfo); //首次初始化；重试不覆盖现存库存
    rpc SetInv(GoodsInventoryInfo) returns (google.protobuf.Empty); //设置库存
    rpc InvDetail(GoodsInventoryInfo) returns (GoodsInventoryInfo); //查询库存
    rpc GetStockOperation(StockOperationRequest) returns (StockOperationResponse); //按订单号查询已提交结果
    rpc Sell(SellInfo) returns (google.protobuf.Empty);   //扣减库存
    rpc Reback(SellInfo) returns (google.protobuf.Empty); //归还库存

}

//库存信息
message GoodsInventoryInfo {
    int32 goodsId = 1;
    int32 num = 2;
}

//批量库存信息
message SellInfo {
    repeated GoodsInventoryInfo goodsInfo = 1;
    string orderSn = 2;
}

enum StockOperationState {
    STOCK_OPERATION_UNSPECIFIED = 0;
    STOCK_RESERVED = 1;
    STOCK_RELEASED = 2;
    STOCK_CANCELLED = 3;
}
message StockOperationRequest { string orderSn = 1; }
message StockOperationResponse {
    string orderSn = 1;
    StockOperationState state = 2;
    repeated GoodsInventoryInfo goodsInfo = 3;
}
