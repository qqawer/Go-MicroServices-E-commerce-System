syntax = "proto3";
package mxshop.address.v1;
import "google/protobuf/empty.proto";
option go_package = ".;proto";

// Hosted by user-srv. Every operation is scoped to the authenticated Web user.
service AddressBook {
  rpc ListAddresses(AddressListRequest) returns (AddressListResponse);
  rpc GetAddress(AddressLookup) returns (Address);
  rpc CreateAddress(CreateAddressRequest) returns (Address);
  rpc UpdateAddress(UpdateAddressRequest) returns (Address);
  rpc DeleteAddress(AddressLookup) returns (google.protobuf.Empty);
}
message Address {
  int32 id = 1;
  int32 user_id = 2;
  string name = 3;
  string mobile = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string address = 8;
}
message AddressLookup {
  int32 user_id = 1;
  int32 id = 2;
}
message AddressListRequest {
  int32 user_id = 1;
  int32 pn = 2;
  int32 psize = 3;
}
message AddressListResponse {
  int32 total = 1;
  repeated Address data = 2;
}
message CreateAddressRequest {
  int32 user_id = 1;
  string name = 2;
  string mobile = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  string address = 7;
}
message UpdateAddressRequest {
  int32 user_id = 1;
  int32 id = 2;
  optional string name = 3;
  optional string mobile = 4;
  optional string province = 5;
  optional string city = 6;
  optional string district = 7;
  optional string address = 8;
}
