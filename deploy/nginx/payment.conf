# The public listener exposes only the signed Alipay notification endpoint.
# Resolve Docker DNS again after Web containers are replaced during releases.
resolver 127.0.0.11 valid=10s ipv6=off;
log_format payment '$remote_addr [$time_local] $request_method $uri $status';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout payment;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location = /g/v1/pay/alipay/notify {
        if ($request_method != POST) { return 405; }
        set $order_backend order-web:8023;
        proxy_pass http://$order_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    location / { return 404; }
}

# Internal process health is not a public application endpoint.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /health { return 200 'ok'; }
    location / { return 404; }
}
